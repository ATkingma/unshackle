name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test

      - name: Test sample (target code for Unshackle)
        run: dotnet test --solution samples/SampleShop/SampleShop.slnx
