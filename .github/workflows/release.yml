name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # NuGet Trusted Publishing: short-lived key via OIDC, no stored secret

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test

      - name: Pack
        run: dotnet pack src/Unshackle.Interface -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ATkingma

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
