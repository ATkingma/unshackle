 constructor, new()?</tspan></text></g><g class="bTA="><g class="shape" ><rect x="12" y="417" width="314" height="66" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="169" y="455.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Manual: &lt;option&gt; for X is not migrated</text></g><g class="bTI="><g class="shape" ><rect x="239" y="670" width="213" height="66" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="345.5" y="708.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Manual: ForPath reason</text></g><g class="bTM="><g class="shape" ><rect x="985" y="670" width="311" height="66" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1140.5" y="708.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Manual: AutoMapper keeps that value</text></g><g class="dG9fbmV4dF9xMQ=="><g class="shape" ><path d="M 473 670 H 944 C 945 670 946 670 947 671 L 964 687 C 965 688 965 689 965 690 V 773 C 965 773 965 773 965 773 H 473 C 472 773 472 773 472 773 V 671 C 472 670 472 670 473 670 Z" fill="#e5e7eb" class=" stroke-B1" style="stroke-width:2;" /><path d="M 964 773 H 473 C 472 773 472 773 472 772 V 671 C 472 670 472 670 473 670 H 943 C 944 670 944 670 944 671 V 688 C 944 689 945 690 946 690 H 964 C 965 690 965 690 965 691 V 772 C 964 773 965 773 964 773 Z" fill="#e5e7eb" class=" stroke-B1" style="stroke-width:2;" /></g><text x="718.5" y="719" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="718.5" dy="0">Continued in Figure 1b: Map needs MapInto, or forward ForPath</tspan><tspan x="718.5" dy="18.5">with ReverseMap (AutoMapper reverses it)?</tspan></text></g><g class="dG9fbmV4dF9xNA=="><g class="shape" ><path d="M 1317 670 H 1771 C 1772 670 1773 670 1774 671 L 1791 687 C 1792 688 1792 689 1792 690 V 757 C 1792 757 1792 757 1792 757 H 1317 C 1316 757 1316 757 1316 757 V 671 C 1316 670 1316 670 1317 670 Z" fill="#e5e7eb" class=" stroke-B1" style="stroke-width:2;" /><path d="M 1791 757 H 1317 C 1316 757 1316 757 1316 756 V 671 C 1316 670 1316 670 1317 670 H 1770 C 1771 670 1771 670 1771 671 V 688 C 1771 689 1772 690 1773 690 H 1791 C 1792 690 1792 690 1792 691 V 756 C 1791 757 1792 757 1791 757 Z" fill="#e5e7eb" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1554" y="719" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px">Continued in Figure 1b: Condition passes the MapFrom rules?</text></g><g class="KHAxIC0mZ3Q7IHAyKVswXQ=="><marker id="mk-d2-1159928908-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 532 96 L 532 160" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159928908-3488378134)" mask="url(#d2-1159928908)" /></g><g class="KHAyIC0mZ3Q7IG0wKVswXQ=="><path d="M 438.25 248 L 438.25 276 S 438.25 286 428.25 286 L 179 286 S 169 286 169 296 L 169 413" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159928908-3488378134)" mask="url(#d2-1159928908)" /><text x="258.5" y="292" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">no</text></g><g class="KHAyIC0mZ3Q7IHEyKVswXQ=="><path d="M 532 248 L 532 413" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159928908-3488378134)" mask="url(#d2-1159928908)" /><text x="532" y="337" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">ForPath</text></g><g class="KHAyIC0mZ3Q7IHEzKVswXQ=="><path d="M 625.75 248 L 625.75 276 S 625.75 286 635.75 286 L 1337.25 286 S 1347.25 286 1347.25 296 L 1347.25 413" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159928908-3488378134)" mask="url(#d2-1159928908)" /><text x="1032" y="292" class="text-italic fill-N2" style="text