" width="247" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="246.5" y="748.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="246.5" dy="0">Manual: private or protected</tspan><tspan x="246.5" dy="18.5">(nested-private-dto)</tspan></text></g><g class="cTY="><g class="shape" ><path d="M 634 834 C 632 834 631 834 630 834 L 392 773 C 389 772 389 771 392 771 L 630 710 C 633 709 636 709 639 710 L 877 770 C 880 771 880 772 877 772 L 638 834 C 637 834 636 834 634 834 Z" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="634" y="769.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="634" dy="0">MapFrom names accessible and</tspan><tspan x="634" dy="18.5">the same next to the outer type?</tspan></text></g><g class="bTY="><g class="shape" ><rect x="307" y="1005" width="255" height="114" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="434.5" y="1043.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="434.5" dy="0">Manual: private or protected /</tspan><tspan x="434.5" dy="17.25">means something else</tspan><tspan x="434.5" dy="17.25">(nested-private-member,</tspan><tspan x="434.5" dy="17.25">nested-outer-member)</tspan></text></g><g class="cTc="><g class="shape" ><path d="M 835 1111 C 833 1111 832 1111 830 1111 L 584 1066 C 581 1066 581 1065 584 1064 L 830 1019 C 833 1019 837 1019 839 1019 L 1085 1064 C 1088 1064 1088 1065 1085 1066 L 840 1111 C 838 1111 837 1111 835 1111 Z" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="835" y="1070.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">&lt;Outer&gt;&lt;Profile&gt;Extensions free?</text></g><g class="bTc="><g class="shape" ><rect x="594" y="1290" width="202" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="695" y="1328.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">Manual: already exists</tspan><tspan x="695" dy="18.5">(nested-name-taken)</tspan></text></g><g class="ZjA="><g class="shape" ><rect x="816" y="1290" width="318" height="114" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="975" y="1328.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="975" dy="0">Fixed: empty constructor,</tspan><tspan x="975" dy="17.25">extension class after the outer type</tspan><tspan x="975" dy="17.25">(nested-profile, nested-record,</tspan><tspan x="975" dy="17.25">nested-in-nested, expression-bodied*)</tspan></text></g><g class="ZnJvbV9wcmV2aW91c19xNA=="><g class="shape" ><ellipse rx="105.5" ry="35" cx="280.5" cy="47" fill="#e5e7eb" class="shape stroke-B1" style="stroke-width:2;" /></g><text x="280.5" y="52.5" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px">From Figure 3a</text></g><g class="KGZyb21fcHJldmlvdXNfcTQgLSZndDsgcTQpWzBd"><marker id="mk-d2-4236081052-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 281 84 L 281 147" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4236081052-3488378134)" mask="url(#d2-4236081052)" /></g><g class="KHE0IC0mZ3Q7IG00KVswXQ=="><path d="M 121.004785 239.999994 L 121.490431 443.000011" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4236081052-3488378134)" mask="url(#d2-4236081052)" /><text x="121.5" y="348" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">no</text></g><g class="KHE0IC0mZ3Q7IHE1KVswXQ=="><path d="M 441 239 L 441 443" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4236081052-3488378134)" mask="url(#d2-4236081052)" /><text x="441.5" y="348" class="text-italic fill-N2" style="text-anchor:middle;font-size:1