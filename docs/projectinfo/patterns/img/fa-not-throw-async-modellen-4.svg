roke-B1" style="stroke-width:2;" /></g><text x="302" y="716.5" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="302" dy="0">Manual: built with FluentAssertions</tspan><tspan x="302" dy="18.5">(proof: awaiting)</tspan></text></g><g class="cTY="><g class="shape" ><path d="M 718 770 C 716 770 715 770 713 770 L 472 725 C 469 725 469 724 472 723 L 713 678 C 716 678 719 678 722 678 L 964 723 C 967 723 967 724 964 725 L 723 770 C 721 770 720 770 718 770 Z" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="718" y="729.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Func&lt;Task&gt; of Func&lt;Task&lt;ref&gt;&gt;?</text></g><g class="bTY="><g class="shape" ><rect x="125" y="941" width="462" height="82" rx="12" fill="#ffe0b2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="356" y="979.5" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="356" dy="0">Manual: the only delegates Should.NotThrowAsync accepts</tspan><tspan x="356" dy="18.5">(proof: value-result)</tspan></text></g><g class="cTc="><g class="shape" ><path d="M 1079 1033 C 1075 1033 1073 1033 1070 1033 L 611 988 C 606 988 606 987 611 986 L 1070 941 C 1075 941 1082 941 1087 941 L 1547 986 C 1552 986 1552 987 1547 988 L 1088 1033 C 1085 1033 1083 1033 1079 1033 Z" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="1079" y="992.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Geen benoemde argumenten; because constant formatteerbaar?</text></g><g class="bTc="><g class="shape" ><rect x="420" y="1204" width="658" height="82" rx="12" fill="#ffe0b2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="749" y="1242.5" fill="#000000" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="749" dy="0">Manual: named arguments, or becauseArgs whose because is no constant format string</tspan><tspan x="749" dy="18.5">(geen proof)</tspan></text></g><g class="b