&lt;ref type&gt;&gt;?</tspan></text></g><g class="cWE="><g class="shape" ><path d="M 253 957 C 251 957 250 957 249 957 L 40 896 C 38 895 38 894 40 894 L 249 833 C 251 832 255 832 257 833 L 466 893 C 468 894 468 895 466 895 L 257 957 C 256 957 255 957 253 957 Z" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="253" y="892.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253" dy="0">ThrowExactlyAsync, of geen</tspan><tspan x="253" dy="18.5">AggregateException-risico?</tspan></text></g><g class="bTA="><g class="shape" ><rect x="1002" y="275" width="280" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1142" y="313.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1142" dy="0">Manual: Inside an AssertionScope</tspan><tspan x="1142" dy="18.5">(geen eigen proof)</tspan></text></g><g class="bTM="><g class="shape" ><rect x="901" y="538" width="307" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1054.5" y="576.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1054.5" dy="0">Manual: not directly awaited / is used</tspan><tspan x="1054.5" dy="18.5">(no-await, where, value-used)</tspan></text></g><g class="bTQ="><g class="shape" ><rect x="488" y="833" width="486" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="731" y="871.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="731" dy="0">Manual: Awaiting-receiver/lambda, FA-subject / reference type</tspan><tspan x="731" dy="18.5">(Invoking/*, value-func)</tspan></text></g><g class="bWE="><g class="shape" ><rect x="237" y="1128" width="312" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="393" y="1166.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="393" dy="0">Manual: unwraps AggregateException</tspan><tspan x="393" dy="18.5">(aggregate-result)<