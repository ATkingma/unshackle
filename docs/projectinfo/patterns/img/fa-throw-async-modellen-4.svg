chter-*,</tspan><tspan x="544" dy="18.5">geen regeleinde naast *?</tspan></text></g><g class="bTU="><g class="shape" ><rect x="953" y="447" width="344" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1125" y="485.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1125" dy="0">Manual: named arguments or becauseArgs</tspan><tspan x="1125" dy="18.5">(geen proof)</tspan></text></g><g class="bTc="><g class="shape" ><rect x="12" y="1005" width="530" height="82" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="277" y="1043.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277" dy="0">Manual: not a string constant / wildcards other than / line break</tspan><tspan x="277" dy="18.5">(message-variable, message-wildcard, message-contains-line-break)</tspan></text></g><g class="ZjE="><g class="shape" ><rect x="813" y="710" width="558" height="114" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1092" y="748.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1092" dy="0">Fixed: await Should.ThrowAsync&lt;T&gt;(act[, because])[.ConfigureAwait(..)]</tspan><tspan x="1092" dy="17.25">[(..).ShouldBeOfType&lt;T&gt;() bij ThrowExactlyAsync]</tspan><tspan x="1092" dy="17.25">(simple, func-task-reference, because, because-args,</tspan><tspan x="1092" dy="17.25">edge-configure-await, edge-local-async-lambda, aggregate-awaited)</tspan></text></g><g class="ZjI="><g class="shape" ><rect x="562" y="1005" width="500" height="98" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="812" y="1043.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="812" dy="0">Fixed: (await Should.ThrowAsync&lt;T&gt;(act)).Message.ShouldX(...)</tspan><tspan x="812" dy="17.666667">(message-contains, -starts, -ends, -exact, -because,</tspan><tspan x="812" dy="17.666667">-because-args, -line-break)</tspan></text></g><g clas